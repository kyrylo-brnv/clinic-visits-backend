services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-clinic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinic}
      POSTGRES_DB: ${DB_NAME:-clinic_visits}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=${DB_USER:-clinic} --dbname=${DB_NAME:-clinic_visits}"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      node.store.allow_mmap: "false"
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrations:
    image: migrate/migrate:v4.18.3
    # lib/pq reads these values without URI parsing the password.
    environment:
      PGUSER: ${DB_USER:-clinic}
      PGPASSWORD: ${DB_PASSWORD:-clinic}
      PGDATABASE: ${DB_NAME:-clinic_visits}
      PGSSLMODE: disable
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:5432",
        "up",
      ]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: clinic-visits-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-clinic}
      DB_PASSWORD: ${DB_PASSWORD:-clinic}
      DB_NAME: ${DB_NAME:-clinic_visits}
      DB_SSLMODE: disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

  backfill:
    profiles: ["tools"]
    image: clinic-visits-api:local
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/clinic-visits-backfill"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-clinic}
      DB_PASSWORD: ${DB_PASSWORD:-clinic}
      DB_NAME: ${DB_NAME:-clinic_visits}
      DB_SSLMODE: disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      migrations:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

volumes:
  postgres-data:
  elasticsearch-data:
